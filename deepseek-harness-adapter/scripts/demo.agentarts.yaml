# Copy this file and replace paths/endpoints/credentials for your environment.
# The field names intentionally follow 架构设计.md's final agent_metadata example.
# All credentials below are placeholders — replace them with real values and never commit real keys.
agent_metadata:
  system_prompt: |
    You are running through the AgentArts DSH adapter demo.
    Answer briefly and do not claim that recall has been consumed by the default runner.
  allowed_tools:
    - read
    - read_image
  # Change this to the actual mounted skill directory. Windows example: D:/demo/skills
  skills: D:\temp\agentarts-demo-skills

  model_config:
    name: deepseek-chat
    base_url: https://api.deepseek.com
    # Override with DEEPSEEK_API_KEY, or resolve via credential_provider_name; never commit a real key.
    api_key: ''
    credential_provider_name: model_ds

  mcp_config:
    - id: company-mcp-gateway
      endpoint: https://gateway.example.com/mcp   # 替换为真实网关地址
      protocol_type: mcp
      protocol_configuration:
        mcp:
          search_configuration:
            search_type: ""
          supported_versions:
            - "2025-03-26"
          session_configuration:
            enabled: false
      auth_type: api_key
      api_key: replace-me                         # 替换为真实网关 API Key（带或不带 Bearer 前缀均可）
      identity_urn: agentIdentity:cn-southwest-2:workloadIdentity:default/gateway-example   # 替换为真实 identity_urn
      credential_provider_name: ''
      auth_location: header
      auth_param_name: Authorization

  # memory_config: id / api_key 均为占位，替换为真实值；endpoint 走 private_access 优先，否则 public_access。
  memory_config:
    id: demo-memory
    api_key: replace-me
    auth_type: api_key
    # private_access:
    #   domain_name: memory.internal.example.com
    #   ip: ""
    public_access:
      domain_name: memory.example.com
      ip: ""

  # Omit mcp_config entirely for the default demo so DSH does not try to
  # connect to an unavailable server. When configured, only protocol_type: mcp is accepted.
  # It is an array (one entry per MCP gateway). Example:
  # mcp_config:
  #   - id: company-mcp-gateway
  #     endpoint: https://gateway.example.com/mcp
  #     protocol_type: mcp
  #     protocol_configuration:
  #       mcp:
  #         search_configuration:
  #           search_type: ""
  #         supported_versions:
  #           - "2025-03-26"
  #         session_configuration:
  #           enabled: false
  #     auth_type: api_key
  #     identity_urn: agentIdentity:cn-southwest-2:workloadIdentity:default/gateway-example
  #     credential_provider_name: gateway-example
  #     auth_location: header
  #     auth_param_name: Authorization

  # The memory_config has no endpoint field: its private_access.domain_name and
  # public_access.domain_name hold the endpoints, private preferred over public.
  # Example:
  # memory_config:
  #   id: demo-memory
  #   api_key: replace-me
  #   auth_type: api_key
  #   private_access:
  #     domain_name: memory.internal.example.com
  #     ip: ""
  #   public_access:
  #     domain_name: memory.public.example.com
  #     ip: ""
packages:
    - shared
    - adapter

# 跨仓 file: 链接本地 SDK 时，其内部 workspace:* 依赖 agentidentity 不在本 workspace，
# 覆盖为本地路径（该包 dist 已在 SDK 仓构建，依赖均为 npm 包）
overrides:
    '@huaweicloud/huaweicloud-sdk-agentidentity': 'file:../../agentarts-sdk-js/packages/huaweicloud-sdk-agentidentity'

allowBuilds:
    esbuild: true

# 与 SDK 仓一致：上游 core@3.1.222 运行期 require('uuid') 但未声明依赖，此处补上
packageExtensions:
    '@huaweicloud/huaweicloud-sdk-core':
        dependencies:
            uuid: ^9.0.0
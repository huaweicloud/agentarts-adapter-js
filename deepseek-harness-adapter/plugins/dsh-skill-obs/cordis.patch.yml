# AgentRun OBS skill bundle.
# The mount directory is injected statically; the plugin fills it before the first model call.
- insert:
    - id: dsh-skill-obs
      name: '@agentarts/dsh-skill-obs'
      config:
        enabled: !!js Boolean(process.env.agent_metadata || process.env.AGENTRUN_SKILLS)
        mountDir: !!js process.env.AGENTRUN_SKILLS_DIR || '/home/agentarts/skills'
        region: !!js process.env.HUAWEICLOUD_SDK_REGION || 'cn-southwest-2'
        # Default: reuse a valid extracted skill (cache). Set AGENTRUN_SKILLS_FORCE_REFRESH=1 to force re-download.
        forceRefresh: !!js process.env.AGENTRUN_SKILLS_FORCE_REFRESH === '1'

# Point the DSH skill loader at the same mount directory. Later patch layers may override this.
# !!js only accepts scalars, so the directory list uses a block sequence of scalar expressions.
- id: skill-filesystem
  config:
    includeDefaultRoots: true
    customSkillDirs:
      - !!js process.env.AGENTRUN_SKILLS_DIR || '/home/agentarts/skills'
    watch: false
